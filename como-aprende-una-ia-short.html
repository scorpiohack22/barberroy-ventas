<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Short «Cómo aprende una IA». Única dependencia externa: Three.js r128 (cdnjs). -->
<title>Cómo aprende una IA</title>
<meta name="description" content="Animación 3D procedural en Three.js: qué ocurre dentro de un modelo de lenguaje cuando le envías un mensaje.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: una sola pantalla. Escenario 9:16 centrado (letterbox) y controles discretos debajo.
   Pieza deliberadamente oscura en un único tema: negro casi absoluto, oro cálido, texto marfil. */
:root{
  --bg:#020203;
  --ink:#f1e8d6;
  --muted:#8b8375;
  --gold:#d6a64c;
  --gold-hi:#f4d28c;
  --rule:rgba(214,166,76,.24);
  --sel:#3c7cf0;
  --cap-dim:#8d9399;
  --f-sub:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
/* Sin rótulo de secuencia, sin tiempo y sin subtítulos: solo los textos explicativos dentro de las escenas */
#hud,#cap{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--f-sub);-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
#stage{position:relative;background:#101215;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 30px 90px rgba(0,0,0,.7);--sw:360px;flex:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none}
#vignette{background:radial-gradient(130% 90% at 50% 46%,transparent 58%,rgba(0,0,0,.45) 100%)}
#grain{opacity:.05;mix-blend-mode:overlay;background-size:220px 220px;animation:grain .48s steps(4) infinite}
@keyframes grain{0%{background-position:0 0}25%{background-position:-60px 40px}50%{background-position:40px -80px}75%{background-position:-90px -20px}100%{background-position:0 0}}
#flash{background:radial-gradient(circle at 50% 46%,rgba(255,244,222,1) 0%,rgba(244,196,110,.7) 30%,rgba(120,70,10,.15) 60%,rgba(0,0,0,0) 80%);opacity:0;mix-blend-mode:screen}
#fade{background:#000;opacity:0}
#hud{opacity:.7;position:absolute;top:4.2%;left:7%;right:7%;display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:calc(var(--sw)*.026);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);pointer-events:none}
#hud b{color:var(--gold);font-weight:500;margin-right:.7em}
#seqName{transition:opacity .6s}
#note{position:absolute;left:9%;right:9%;bottom:4.2%;text-align:center;font-family:var(--f-mono);font-size:calc(var(--sw)*.024);line-height:1.5;color:rgba(220,226,232,.55);letter-spacing:.01em;opacity:0;pointer-events:none;text-wrap:balance}
#note::before{content:"";display:inline-block;width:.55em;height:.55em;border:1px solid var(--gold);border-radius:50%;margin-right:.6em;vertical-align:.02em}
/* Subtítulos cinéticos: palabra a palabra, arriba; la palabra clave activa lleva recuadro de selección */
#cap{position:absolute;left:7%;right:7%;top:14%;text-align:center;font-weight:400;font-size:calc(var(--sw)*.064);line-height:1.2;color:var(--cap-dim);
  letter-spacing:-.01em;text-wrap:balance;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.55)}
#cap .w{display:inline-block;position:relative;opacity:0;transition:opacity .14s ease,color .14s ease}
#cap .w.on{opacity:1}
#cap .w.k{font-weight:600;color:#fff}
#cap .w.cur{color:#fff}
#cap .w i{display:none;position:absolute;width:.2em;height:.2em;border-radius:50%;border:1.5px solid var(--sel);background:#101317}
#cap .w b{display:none;position:absolute;inset:.02em -.12em -.02em;border:1.5px solid var(--sel);border-radius:2px}
#cap .w.cur.k b,#cap .w.cur.k i{display:block}
#cap .w i.d1{left:-.22em;top:-.06em}
#cap .w i.d2{right:-.22em;bottom:-.08em}
#poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:calc(var(--sw)*.04);padding-bottom:22%;
  background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 70%);cursor:pointer;border:0;color:var(--ink);font:inherit;width:100%}
#poster h1{margin:0;font-weight:500;font-size:calc(var(--sw)*.085);letter-spacing:-.01em;text-wrap:balance;text-align:center;line-height:1.05}
#poster p{margin:0;font-family:var(--f-mono);font-size:calc(var(--sw)*.028);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
#poster .pbtn{width:calc(var(--sw)*.19);height:calc(var(--sw)*.19);border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;background:rgba(214,166,76,.08);box-shadow:0 0 40px rgba(214,166,76,.25)}
#poster .pbtn svg{width:34%;height:34%;margin-left:8%;fill:var(--gold-hi)}
#poster:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
#script{position:absolute;inset:0;background:rgba(2,2,3,.94);overflow:auto;padding:12% 8% 10%;font-size:calc(var(--sw)*.036);line-height:1.55;color:var(--ink)}
#script h2{font-family:var(--f-mono);font-weight:500;font-size:calc(var(--sw)*.028);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 1.2em}
#script ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.1em}
#script time{display:block;font-family:var(--f-mono);font-size:.72em;color:var(--muted);letter-spacing:.08em}
#script .hint{margin-top:2em;font-size:.8em;color:var(--muted)}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:10%;text-align:center;color:var(--ink);font-size:15px;line-height:1.5}
#controls{display:flex;flex-direction:column;gap:8px;flex:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.top{flex-wrap:nowrap}
#scrub{flex:1;min-width:0;accent-color:var(--gold);height:18px;margin:0}
#time{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{appearance:none;background:transparent;border:1px solid var(--rule);color:var(--ink);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;height:30px;min-width:30px;padding:0 9px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn[aria-pressed="true"]{background:rgba(214,166,76,.14);border-color:var(--gold);color:var(--gold-hi)}
.btn svg{width:13px;height:13px;fill:currentColor}
.btn:disabled{opacity:.4;cursor:not-allowed}
.spacer{flex:1}
#audioFile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#grain{animation:none}}
</style>

<div id="app">

    <div class="ov" id="vignette"></div>

    </div>

  </div>

      <input id="scrub" type="range" min="0" max="305" step="1" value="0" aria-label="Línea de tiempo">

    </div>
    <div class="row">
      <button class="btn" id="bQuality" type="button" aria-pressed="false" title="Calidad de render">Calidad: alta</button>

      <button class="btn" id="bScript" type="button" aria-pressed="false">Guion</button>
      <span class="spacer"></span>
      <button class="btn" id="bFull" type="button" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3zm11 0h7v7h-2V5h-5zM3 14h2v5h5v2H3zm16 0h2v7h-7v-2h5z"/></svg></button>
    </div>
  </div>
</div>

// Las texturas de texto se dibujan con las fuentes web ya cargadas (con límite de espera)

// Paleta para efectos aditivos (espacio de pantalla)

const L_GOLD = [1.0, 0.72, 0.30];

/* ================================================================
   2. RENDERER, ESCENA, CÁMARA, ENTORNO
   ================================================================ */

const FOG_COL = srgb(0x15191c);

// Fondo: degradado gris azulado, cuadrícula técnica y motas (en espacio de pantalla)
const bgMat = new THREE.ShaderMaterial({
  uniforms: { uRes: { value: new THREE.Vector2(1, 1) }, uOff: { value: new THREE.Vector2() }, uT: { value: 0 }, uDim: { value: 1 } },
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.9999, 1.0); }`,
  fragmentShader: `
    uniform vec2 uRes, uOff; uniform float uT, uDim;

{ const bgq = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat); bgq.frustumCulled = false; bgq.renderOrder = -1000; scene.add(bgq); }
const camera = new THREE.PerspectiveCamera(40, 9 / 16, 0.02, 320);

(function buildEnv() {
  const es = new THREE.Scene();
  const sg = new THREE.SphereGeometry(60, 32, 16);
  const pa = sg.attributes.position, cols = [];
  for (let i = 0; i < pa.count; i++) { const y = pa.getY(i) / 60; const v = 0.006 + 0.018 * Math.max(0, y); cols.push(v, v * 0.97, v * 1.05); }

  es.add(new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));
  const panel = (w, h, p, k, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(p[0], p[1], p[2]); m.lookAt(0, 0, 0); es.add(m); };

  panel(4, 44, [32, 2, -8], 1.7, 0xc4d2ff);     // tira de contraluz fría
  panel(26, 3, [4, -12, 32], 0.7, 0xffc47a);    // rebote cálido bajo
  panel(3, 30, [-32, 4, -22], 1.1, 0xffffff);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(es, 0.03).texture;
  pm.dispose();
})();

const keyL = new THREE.DirectionalLight(0xfff0dc, 2.1); keyL.position.set(-4, 7, 6); scene.add(keyL);
const rimL = new THREE.DirectionalLight(0x9fb4ff, 1.25); rimL.position.set(6, 1.5, -6); scene.add(rimL);
scene.add(new THREE.HemisphereLight(0x1c1e26, 0x050403, 0.4));
const workL = new THREE.PointLight(0xffc06a, 0, 16, 2); scene.add(workL);

const M = {
  graphite: new THREE.MeshStandardMaterial({ color: srgb(0x1d1e22), metalness: .82, roughness: .34 }),
  gold: new THREE.MeshStandardMaterial({ color: srgb(0xc99a45), metalness: 1, roughness: .26, emissive: srgb(0x4a2e08), emissiveIntensity: .7 }),
  titanium: new THREE.MeshStandardMaterial({ color: srgb(0x48463f), metalness: 1, roughness: .27 }),
  glass: new THREE.MeshStandardMaterial({ color: srgb(0x050506), metalness: .3, roughness: .06, envMapIntensity: 1.5 }),
  dark: new THREE.MeshStandardMaterial({ color: srgb(0x111114), metalness: .9, roughness: .32 }),
  node: new THREE.MeshStandardMaterial({ color: srgb(0xd8aa55), metalness: 1, roughness: .22, emissive: srgb(0x6b3c06), emissiveIntensity: .5 })
};
M.pad = new THREE.MeshStandardMaterial({ color: srgb(0xeceef0), metalness: .05, roughness: .38 });
M.tile = new THREE.MeshStandardMaterial({ color: srgb(0x3c4148), metalness: .55, roughness: .3 });
M.slab = new THREE.MeshStandardMaterial({ color: srgb(0x2a2f35), metalness: .5, roughness: .42 });
M.glassPlate = new THREE.MeshStandardMaterial({ color: srgb(0x9db2c4), metalness: .1, roughness: .06, transparent: true, opacity: .22, depthWrite: false });
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3(), _v = new THREE.Vector3(), _e = new THREE.Euler();

/* ================================================================
   3. PRIMITIVAS DE EFECTO: puntos luminosos (con DOF) y filamentos
   ================================================================ */
const glowMat = new THREE.ShaderMaterial({
  uniforms: { uScale: { value: 800 }, uFocus: { value: 8 }, uDof: { value: 1 }, uFog: { value: .02 } },
  vertexShader: `
    attribute float size; attribute float alpha; attribute vec3 color;
    uniform float uScale, uFocus, uDof, uFog;
    varying vec3 vColor; varying float vAlpha;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float d = max(-mv.z, 0.001);
      float px = size * uScale / d;
      float blur = uDof * abs(d - uFocus) / d * uScale * 0.010;
      float tot = clamp(px + blur, 0.0, 160.0);
      float f = exp(-uFog * uFog * d * d);
      vAlpha = alpha * f * clamp((px * px + 2.0) / (tot * tot + 2.0), 0.002, 1.0);
      vColor = color;
      gl_PointSize = tot;
      gl_Position = projectionMatrix * mv;

    }`,
  fragmentShader: `
    varying vec3 vColor; varying float vAlpha;
    void main(){
      vec2 c = gl_PointCoord - 0.5; float r2 = dot(c, c) * 4.0;
      if (r2 > 1.0) discard;
      float core = exp(-r2 * 16.0); float halo = exp(-r2 * 3.2) * (1.0 - r2);
      gl_FragColor = vec4(vColor * (core * 1.5 + halo * 0.6) * vAlpha, 1.0);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
class Glow {
  constructor(n, parent) {
    this.n = n;
    this.pos = new Float32Array(n * 3); this.col = new Float32Array(n * 3);

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('color', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('size', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('alpha', new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage));
    this.geo = g;
    this.obj = new THREE.Points(g, glowMat); this.obj.frustumCulled = false; this.obj.renderOrder = 10;
    (parent || scene).add(this.obj);

});
// Voz sintética del navegador (Web Speech API, gratuita y local). Solo si hay voz en español.

if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; } else { bVoice.disabled = true; }

  if (reset) { spoken = new Set(); NARRATION.forEach((n, i) => { if (n[0] < clock.t - .3) spoken.add(i); }); }

bScript.addEventListener('click', () => { scriptBox.hidden = !scriptBox.hidden; bScript.setAttribute('aria-pressed', String(!scriptBox.hidden)); });
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' && e.target.type !== 'range')) return;
  if (e.code === 'Space') { e.preventDefault(); clock.playing ? pause() : play(); }
  else if (e.key === 'r' || e.key === 'R') restart();

{ const c = document.createElement('canvas'); c.width = c.height = 220; const x = c.getContext('2d'), d = x.createImageData(220, 220), r = rng(5); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); $('grain').style.backgroundImage = `url(${c.toDataURL()})`; }

// Bucle principal: el progreso se calcula con el tiempo real transcurrido, no con fotogramas
function loop(now) {
  requestAnimationFrame(loop);
  if (clock.playing) {
    const dt = clamp((now - clock.last) / 1000, 0, .25); clock.last = now;
    if (hasAudio && !audio.paused && audio.readyState >= 2 && audio.currentTime < DUR && Math.abs(audio.currentTime - clock.t) < 1.5) clock.t = audio.currentTime;
