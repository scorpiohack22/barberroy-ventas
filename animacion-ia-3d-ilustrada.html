<style>
/* Layout: una sola pantalla. Escenario 9:16 centrado (letterbox) y controles discretos debajo.

:root{
  --bg:#020203;
  --ink:#f1e8d6;
  --muted:#8b8375;
  --gold:#d6a64c;
  --gold-hi:#f4d28c;

  color-scheme:dark;
}
[hidden]{display:none!important}
/* Sin rótulo de secuencia, sin tiempo y sin subtítulos: solo los textos explicativos dentro de las escenas */
#hud,#cap{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--f-sub);-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
#stage{position:relative;background:#101215;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 30px 90px rgba(0,0,0,.7);--sw:360px;flex:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none}
#vignette{background:radial-gradient(130% 90% at 50% 46%,transparent 58%,rgba(0,0,0,.45) 100%)}
#grain{opacity:.05;mix-blend-mode:overlay;background-size:220px 220px;animation:grain .48s steps(4) infinite}
@keyframes grain{0%{background-position:0 0}25%{background-position:-60px 40px}50%{background-position:40px -80px}75%{background-position:-90px -20px}100%{background-position:0 0}}
#flash{background:radial-gradient(circle at 50% 46%,rgba(255,244,222,1) 0%,rgba(244,196,110,.7) 30%,rgba(120,70,10,.15) 60%,rgba(0,0,0,0) 80%);opacity:0;mix-blend-mode:screen}
#fade{background:#000;opacity:0}
#hud{opacity:.7;position:absolute;top:4.2%;left:7%;right:7%;display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:calc(var(--sw)*.026);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);pointer-events:none}
#hud b{color:var(--gold);font-weight:500;margin-right:.7em}
#seqName{transition:opacity .6s}
#note{position:absolute;left:9%;right:9%;bottom:4.2%;text-align:center;font-family:var(--f-mono);font-size:calc(var(--sw)*.024);line-height:1.5;color:rgba(220,226,232,.55);letter-spacing:.01em;opacity:0;pointer-events:none;text-wrap:balance}
#note::before{content:"";display:inline-block;width:.55em;height:.55em;border:1px solid var(--gold);border-radius:50%;margin-right:.6em;vertical-align:.02em}
/* Subtítulos cinéticos: palabra a palabra, arriba; la palabra clave activa lleva recuadro de selección */
#cap{position:absolute;left:7%;right:7%;top:14%;text-align:center;font-weight:400;font-size:calc(var(--sw)*.064);line-height:1.2;color:var(--cap-dim);
  letter-spacing:-.01em;text-wrap:balance;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.55)}
#cap .w{display:inline-block;position:relative;opacity:0;transition:opacity .14s ease,color .14s ease}
#cap .w.on{opacity:1}
#cap .w.k{font-weight:600;color:#fff}
#cap .w.cur{color:#fff}
#cap .w i{display:none;position:absolute;width:.2em;height:.2em;border-radius:50%;border:1.5px solid var(--sel);background:#101317}
#cap .w b{display:none;position:absolute;inset:.02em -.12em -.02em;border:1.5px solid var(--sel);border-radius:2px}
#cap .w.cur.k b,#cap .w.cur.k i{display:block}
#cap .w i.d1{left:-.22em;top:-.06em}
#cap .w i.d2{right:-.22em;bottom:-.08em}
#poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:calc(var(--sw)*.04);padding-bottom:22%;

#poster:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
#script{position:absolute;inset:0;background:rgba(2,2,3,.94);overflow:auto;padding:12% 8% 10%;font-size:calc(var(--sw)*.036);line-height:1.55;color:var(--ink)}
#script h2{font-family:var(--f-mono);font-weight:500;font-size:calc(var(--sw)*.028);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 1.2em}
#script ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.1em}
#script time{display:block;font-family:var(--f-mono);font-size:.72em;color:var(--muted);letter-spacing:.08em}
#script .hint{margin-top:2em;font-size:.8em;color:var(--muted)}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:10%;text-align:center;color:var(--ink);font-size:15px;line-height:1.5}
#controls{display:flex;flex-direction:column;gap:8px;flex:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.top{flex-wrap:nowrap}
#scrub{flex:1;min-width:0;accent-color:var(--gold);height:18px;margin:0}
#time{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{appearance:none;background:transparent;border:1px solid var(--rule);color:var(--ink);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;height:30px;min-width:30px;padding:0 9px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn[aria-pressed="true"]{background:rgba(214,166,76,.14);border-color:var(--gold);color:var(--gold-hi)}
.btn svg{width:13px;height:13px;fill:currentColor}
.btn:disabled{opacity:.4;cursor:not-allowed}
.spacer{flex:1}
#audioFile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#grain{animation:none}}

const app = $('app'), controls = $('controls');

const clock = { t: 0, playing: false, last: 0, started: false };

}
function play() {

bPlay.addEventListener('click', () => clock.playing ? pause() : play());
poster.addEventListener('click', () => play());
$('bRestart').addEventListener('click', restart);

const bQ = $('bQuality');
function setQ(q) { quality = q; bQ.textContent = 'Calidad: ' + (q === 'high' ? 'alta' : 'reducida'); bQ.setAttribute('aria-pressed', q === 'low' ? 'true' : 'false'); try { localStorage.setItem('ia3d-quality', q); } catch (e) {} layout(); }
bQ.addEventListener('click', () => setQ(quality === 'high' ? 'low' : 'high'));
$('bFull').addEventListener('click', () => {
  const fe = document.fullscreenElement || document.webkitFullscreenElement;
  try {

    else { const r = (app.requestFullscreen || app.webkitRequestFullscreen); const p = r && r.call(app); if (p && p.catch) p.catch(() => {}); }
  } catch (e) {}
});
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => setTimeout(layout, 60)));
// Pista de audio opcional (narración grabada o música): la línea temporal la sigue
const fileIn = $('audioFile'), bAudio = $('bAudio');
bAudio.addEventListener('click', () => fileIn.click());
fileIn.addEventListener('change', () => {

});
// Voz sintética del navegador (Web Speech API, gratuita y local). Solo si hay voz en español.
const bVoice = $('bVoice'); let voiceOn = false, spoken = new Set(), esVoice = null;
const synth = window.speechSynthesis;

// Guion
const bScript = $('bScript'), scriptBox = $('script');
$('scriptList').innerHTML = NARRATION.map(n => `<li><time>${fmt(n[0])}</time>${n[1]}</li>`).join('');
bScript.addEventListener('click', () => { scriptBox.hidden = !scriptBox.hidden; bScript.setAttribute('aria-pressed', String(!scriptBox.hidden)); });
document.addEventListener('keydown', e => {

{ const c = document.createElement('canvas'); c.width = c.height = 220; const x = c.getContext('2d'), d = x.createImageData(220, 220), r = rng(5); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); $('grain').style.backgroundImage = `url(${c.toDataURL()})`; }
