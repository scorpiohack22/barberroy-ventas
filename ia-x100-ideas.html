<title>IA ×100 · cinco ideas</title>
<meta name="description" content="Animación 3D procedural en Three.js: qué ocurre dentro de un modelo de lenguaje cuando le envías un mensaje.">

<style>
/* Layout: una sola pantalla. Escenario 9:16 centrado (letterbox) y controles discretos debajo.
   Pieza deliberadamente oscura en un único tema: negro casi absoluto, oro cálido, texto marfil. */
:root{
  --bg:#020203;
  --ink:#f1e8d6;
  --muted:#8b8375;
  --gold:#d6a64c;
  --gold-hi:#f4d28c;
  --rule:rgba(214,166,76,.24);
  --sel:#3c7cf0;
  --cap-dim:#8d9399;
  --f-sub:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
/* Sin rótulo de secuencia, sin tiempo y sin subtítulos: solo los textos explicativos dentro de las escenas */
#hud,#cap{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--f-sub);-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
#stage{position:relative;background:#101215;overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 30px 90px rgba(0,0,0,.7);--sw:360px;flex:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none}
#vignette{background:radial-gradient(130% 90% at 50% 46%,transparent 58%,rgba(0,0,0,.45) 100%)}
#grain{opacity:.05;mix-blend-mode:overlay;background-size:220px 220px;animation:grain .48s steps(4) infinite}
@keyframes grain{0%{background-position:0 0}25%{background-position:-60px 40px}50%{background-position:40px -80px}75%{background-position:-90px -20px}100%{background-position:0 0}}
#flash{background:radial-gradient(circle at 50% 46%,rgba(255,244,222,1) 0%,rgba(244,196,110,.7) 30%,rgba(120,70,10,.15) 60%,rgba(0,0,0,0) 80%);opacity:0;mix-blend-mode:screen}
#fade{background:#000;opacity:0}
#hud{opacity:.7;position:absolute;top:4.2%;left:7%;right:7%;display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:calc(var(--sw)*.026);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);pointer-events:none}
#hud b{color:var(--gold);font-weight:500;margin-right:.7em}
#seqName{transition:opacity .6s}
#chip{position:absolute;top:6.5%;left:50%;transform:translateX(-50%);padding:.55em 1.1em;border-radius:999px;background:rgba(18,20,24,.8);border:1px solid rgba(214,166,76,.6);color:#fff;font:600 calc(var(--sw)*.034)/1 var(--f-sub);letter-spacing:.12em;text-transform:uppercase;opacity:0;white-space:nowrap;pointer-events:none}
#chip b{color:var(--gold-hi);margin-right:.7em;font-weight:600}
#note{position:absolute;left:9%;right:9%;bottom:4.2%;text-align:center;font-family:var(--f-mono);font-size:calc(var(--sw)*.024);line-height:1.5;color:rgba(220,226,232,.55);letter-spacing:.01em;opacity:0;pointer-events:none;text-wrap:balance}
#note::before{content:"";display:inline-block;width:.55em;height:.55em;border:1px solid var(--gold);border-radius:50%;margin-right:.6em;vertical-align:.02em}
/* Subtítulos cinéticos: palabra a palabra, arriba; la palabra clave activa lleva recuadro de selección */
#cap{position:absolute;left:7%;right:7%;top:14%;text-align:center;font-weight:400;font-size:calc(var(--sw)*.064);line-height:1.2;color:var(--cap-dim);
  letter-spacing:-.01em;text-wrap:balance;pointer-events:none;text-shadow:0 2px 14px rgba(0,0,0,.55)}
#cap .w{display:inline-block;position:relative;opacity:0;transition:opacity .14s ease,color .14s ease}
#cap .w.on{opacity:1}
#cap .w.k{font-weight:600;color:#fff}
#cap .w.cur{color:#fff}
#cap .w i{display:none;position:absolute;width:.2em;height:.2em;border-radius:50%;border:1.5px solid var(--sel);background:#101317}
#cap .w b{display:none;position:absolute;inset:.02em -.12em -.02em;border:1.5px solid var(--sel);border-radius:2px}
#cap .w.cur.k b,#cap .w.cur.k i{display:block}
#cap .w i.d1{left:-.22em;top:-.06em}
#cap .w i.d2{right:-.22em;bottom:-.08em}
#poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:calc(var(--sw)*.04);padding-bottom:22%;
  background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,0) 70%);cursor:pointer;border:0;color:var(--ink);font:inherit;width:100%}
#poster h1{margin:0;font-weight:500;font-size:calc(var(--sw)*.085);letter-spacing:-.01em;text-wrap:balance;text-align:center;line-height:1.05}

#poster .pbtn{width:calc(var(--sw)*.19);height:calc(var(--sw)*.19);border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;background:rgba(214,166,76,.08);box-shadow:0 0 40px rgba(214,166,76,.25)}
#poster .pbtn svg{width:34%;height:34%;margin-left:8%;fill:var(--gold-hi)}
#poster:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
#script{position:absolute;inset:0;background:rgba(2,2,3,.94);overflow:auto;padding:12% 8% 10%;font-size:calc(var(--sw)*.036);line-height:1.55;color:var(--ink)}
#script h2{font-family:var(--f-mono);font-weight:500;font-size:calc(var(--sw)*.028);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0 0 1.2em}
#script ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1.1em}
#script time{display:block;font-family:var(--f-mono);font-size:.72em;color:var(--muted);letter-spacing:.08em}
#script .hint{margin-top:2em;font-size:.8em;color:var(--muted)}
#err{position:absolute;inset:0;display:grid;place-items:center;padding:10%;text-align:center;color:var(--ink);font-size:15px;line-height:1.5}
#controls{display:flex;flex-direction:column;gap:8px;flex:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.top{flex-wrap:nowrap}
#scrub{flex:1;min-width:0;accent-color:var(--gold);height:18px;margin:0}
#time{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{appearance:none;background:transparent;border:1px solid var(--rule);color:var(--ink);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;height:30px;min-width:30px;padding:0 9px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn[aria-pressed="true"]{background:rgba(214,166,76,.14);border-color:var(--gold);color:var(--gold-hi)}
.btn svg{width:13px;height:13px;fill:currentColor}
.btn:disabled{opacity:.4;cursor:not-allowed}
.spacer{flex:1}
#audioFile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#grain{animation:none}}
</style>

    </div>

</div>

<!-- Dependencia única: Three.js r128 (build UMD, global THREE) desde cdnjs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
'use strict';

/* ================================================================
   0. DATOS: secuencias, subtítulos, narración y notas
   ================================================================ */
// Cinco ideas, una por vídeo. TL = inicio de cada escena (s) calculado a partir de la duración real de cada frase.
const IDEAS = {
  1: { tag: 'Leer documentos', kind: 'pages', before: '2 horas', after: '2 minutos',
       steps: [
         { chip: 'Resume', attach: 'informe.pdf · 50 págs', prompt: 'Resume este informe en 5 puntos clave.', answer: '1. Ventas +12 % en el trimestre\n2. Costes logísticos al alza\n3. Nuevo mercado: México\n4. Riesgo: retraso del proveedor\n5. Meta: lanzar la app en junio' },
         { chip: 'Tareas', prompt: '¿Qué tareas salen de aquí?', answer: '– Renegociar con logística\n– Plan de entrada en México\n– Buscar un proveedor alternativo\n– Fecha de lanzamiento de la app' },
         { chip: 'Comprueba', prompt: '¿Dónde dice lo del proveedor?', answer: 'Página 31, párrafo 2: «El proveedor principal anticipa retrasos de hasta seis semanas en el segundo semestre».' } ] },
  2: { tag: 'Responder correos', kind: 'mail', before: '1 hora al día', after: '10 minutos',
       steps: [
         { chip: 'Pega el correo', prompt: 'Correo de Ana: «¿Movemos la reunión al jueves y revisamos el presupuesto?»\nMis notas: jueves 10 h, presupuesto listo, enviar PDF.', answer: 'Entendido. ¿Qué tono quieres para la respuesta?' },
         { chip: 'Redacta', prompt: 'Redacta una respuesta breve, amable y profesional.', answer: 'Hola, Ana:\nEl jueves a las 10:00 me va perfecto. Ya tengo listo el presupuesto; te lo adjunto en PDF para revisarlo juntos.\nUn saludo.' },
         { chip: 'Tu tono', prompt: 'Hazlo más cercano, como en mis ejemplos.', answer: '¡Hola, Ana! El jueves a las 10 me viene genial. Te paso el presupuesto en PDF y lo vemos juntos. ¡Hasta el jueves!' } ] },
  3: { tag: 'Crear contenido', kind: 'blank', before: '1 día', after: '1 tarde',
       steps: [
         { chip: 'Ideas', prompt: 'Mi público: emprendedores que empiezan. Dame 30 ideas de vídeos que les resuelvan un problema.', answer: '1. Cómo conseguir tus primeros 10 clientes\n2. 3 errores al poner precios\n3. Facturar sin contable\n4. Vender sin anuncios\n… y 26 ideas más' },
         { chip: 'Guion', prompt: 'Escribe un guion de 40 s para la idea 2, con un gancho fuerte.', answer: 'GANCHO: «Cada vez que pones un precio así, pierdes dinero».\n1. Copiar a la competencia\n2. Olvidar tus costes\n3. Tener miedo a subirlo' },
         { chip: 'Títulos', prompt: 'Dame 10 títulos y la descripción.', answer: '1. El error de precios que te hace perder dinero\n2. Así deberías poner tus precios\n3. Deja de cobrar tan poco\n…\nDescripción: aprende a fijar precios con…' } ] },
  4: { tag: 'Excel', kind: 'sheet', before: 'Horas', after: 'Segundos',
       steps: [
         { chip: 'Pide la fórmula', prompt: 'Suma las ventas de cada vendedor por mes. Vendedor en A, fecha en B, importe en C.', answer: '=SUMAR.SI.CONJUNTO(C:C; A:A; "Ana"; B:B; ">="&FECHA(2026;3;1); B:B; "<"&FECHA(2026;4;1))' },
         { chip: 'Entiéndela', prompt: '¿Cómo funciona?', answer: 'Suma la columna C solo en las filas donde:\n• A es «Ana»\n• B está dentro de marzo\nCambia el nombre o el mes para otros casos.' },
         { chip: 'Analiza', attach: 'ventas_2026.xlsx', prompt: '¿Qué producto vendió más este año?', answer: 'El más vendido fue «Auriculares X»: 1.240 unidades (18 % del total). Le siguen «Cargador Pro» y «Funda Slim».' } ] },
  5: { tag: 'Aprender', kind: 'video', before: 'Semanas', after: 'Días',
       steps: [
         { chip: 'Explícamelo', prompt: 'Explícame qué es la inflación como si tuviera 12 años, con un ejemplo real.', answer: 'Imagina que con 10 € comprabas 5 helados. Si un año después solo te alcanza para 4, los precios subieron: eso es la inflación.' },
         { chip: 'Ponme a prueba', prompt: 'Hazme 5 preguntas para comprobar si lo entendí, y corrígeme.', answer: '1. Si el pan pasa de 1 € a 1,10 €, ¿cuánto subió?\n2. ¿Por qué tu dinero «vale menos»?\n3. ¿Quién sale perdiendo?\n…' },
         { chip: 'Corrige', prompt: 'Respuesta 2: porque hay menos billetes.', answer: 'Casi. No es que haya menos billetes: con los mismos billetes compras menos cosas. ¿Probamos con otra?' } ] }
};
const IDEA_ID = (window.IDEA_ID && IDEAS[window.IDEA_ID]) ? window.IDEA_ID : 1;
const IDEA = IDEAS[IDEA_ID];

// Inicio de cada escena: [gancho, problema, paso 1, paso 2, paso 3, resultado, fin]
const TLS = {"1": [0, 5.472, 12.012, 19.269, 26.182, 33.494, 40.417], "2": [0, 5.502, 11.673, 19.494, 28.001, 36.372, 43.709], "3": [0, 5.495, 11.454, 20.521, 28.105, 36.95, 44.027], "4": [0, 5.108, 12.168, 20.643, 27.292, 34.999, 41.971], "5": [0, 4.997, 12.061, 20.599, 28.13, 36.451, 43.445]};
const TL = window.IDEA_TL || TLS[IDEA_ID] || [0, 3, 9, 16, 23, 30, 40];
const DUR = TL[6];
const SEQ = [[0, 'Gancho'], [TL[1], 'El problema'], [TL[2], 'Paso 1'], [TL[3], 'Paso 2'], [TL[4], 'Paso 3'], [TL[5], 'Resultado']];
const CUES = [];
const NARRATION = [];
const NOTES = [[TL[2] + .4, TL[5] - .2, 'Funciona con cualquier asistente de IA: ChatGPT, Claude, Gemini…']];

/* ================================================================
   1. UTILIDADES MATEMÁTICAS DETERMINISTAS
   ================================================================ */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeIn = t => { t = clamp(t); return t * t * t; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, fi = .5, fo = .5) => Math.min(smooth((t - a) / fi), 1 - smooth((t - (b - fo)) / fo));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);
function showError(msg) { const d = document.createElement('div'); d.id = 'err'; d.textContent = msg; stage.appendChild(d); }
if (!window.THREE) { showError('No se pudo cargar Three.js desde cdnjs. Compruebe la conexión y recargue la página.'); return; }
// Las texturas de texto se dibujan con las fuentes web ya cargadas (con límite de espera)
if (document.fonts && document.fonts.load) { try { await Promise.race([Promise.all([document.fonts.load('500 20px "Hanken Grotesk"'), document.fonts.load('600 20px "Hanken Grotesk"'), document.fonts.load('500 20px "JetBrains Mono"')]), new Promise(r => setTimeout(r, 2000))]); } catch (e) {} }

const srgb = hex => new THREE.Color(hex).convertSRGBToLinear();
// Paleta para efectos aditivos (espacio de pantalla)
const C_GOLD = [1.0, 0.74, 0.32], C_WARM = [1.0, 0.9, 0.66], C_WHITE = [1, 0.98, 0.94], C_COOL = [0.45, 0.62, 1.0];
// Paleta lineal para líneas (se codifican a sRGB en la salida)
const L_GOLD = [1.0, 0.72, 0.30];

/* ================================================================
   2. RENDERER, ESCENA, CÁMARA, ENTORNO
   ================================================================ */
let quality = ((navigator.hardwareConcurrency || 8) <= 4 || Math.min(screen.width, screen.height) < 500) ? 'low' : 'high';
try { const q = localStorage.getItem('ia3d-quality'); if (q === 'low' || q === 'high') quality = q; } catch (e) {}

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: false });
} catch (e) { showError('Este navegador no puede crear un contexto WebGL. Pruebe con un navegador actualizado.'); return; }
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.setClearColor(0x101215, 1);
stage.insertBefore(renderer.domElement, stage.firstChild);

const scene = new THREE.Scene();
const FOG_COL = srgb(0x15191c);
scene.fog = new THREE.FogExp2(FOG_COL, 0.02);
// Fondo: degradado gris azulado, cuadrícula técnica y motas (en espacio de pantalla)
const bgMat = new THREE.ShaderMaterial({
  uniforms: { uRes: { value: new THREE.Vector2(1, 1) }, uOff: { value: new THREE.Vector2() }, uT: { value: 0 }, uDim: { value: 1 } },
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.9999, 1.0); }`,
  fragmentShader: `
    uniform vec2 uRes, uOff; uniform float uT, uDim;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main(){
      vec2 f = gl_FragCoord.xy, uv = f / uRes;
      vec3 c = mix(vec3(.122, .145, .158), vec3(.047, .049, .054), smoothstep(.0, .9, uv.y));
      float cell = uRes.y * .05; vec2 g = mod(f + uOff, cell);
      float ln = max(step(g.x, 1.0), step(g.y, 1.0));
      c += ln * .02 * (1.0 - uv.y * .75);
      float sc = uRes.y * .021; vec2 q = f + uOff * .5; vec2 id = floor(q / sc); float r = h(id);
      if (r > .984) { float d = length(mod(q, sc) - sc * .5); c += (1.0 - smoothstep(.5, 1.5, d)) * (.22 + .16 * sin(uT * 1.3 + r * 50.0)); }
      gl_FragColor = vec4(c * uDim, 1.0);
    }`,
  depthTest: false, depthWrite: false
});
{ const bgq = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat); bgq.frustumCulled = false; bgq.renderOrder = -1000; scene.add(bgq); }
const camera = new THREE.PerspectiveCamera(40, 9 / 16, 0.02, 320);

(function buildEnv() {
  const es = new THREE.Scene();
  const sg = new THREE.SphereGeometry(60, 32, 16);
  const pa = sg.attributes.position, cols = [];
  for (let i = 0; i < pa.count; i++) { const y = pa.getY(i) / 60; const v = 0.006 + 0.018 * Math.max(0, y); cols.push(v, v * 0.97, v * 1.05); }
