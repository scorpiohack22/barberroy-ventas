<script>
/* =====================================================================================
   DET_BASE — "EXPEDIENTE" noir detective-file engine, 1920x1080 @24 fps (built by the B1 pilot on top of yt_base)
   WORKFLOW
     cp det_base.html detB.html ; replace ONLY the "SCENES" section (PH_LIST, PH_GRADE, SC.*, SCN, DUR, FADE_IN, FADE_OUT).
     Envelope:  python3 ../batch/mkenv.py ../yt/vo2/bB.wav detB_tl.json          (lip-sync: talk: env(t))
     Preview:   HTML=detB.html TLF=detB_tl.json node det_render.mjs prev/x 24 "1.2,3.4"   -> prev/x_1.2.jpg
     Render:    HTML=detB.html TLF=detB_tl.json node det_render.mjs detB_silent.mp4 24   (F0/F1 env = frame range)
     Mix:       python3 ../yt/detmix.py detB_silent.mp4 ../yt/vo2/bB.wav detB_mix.json ../yt/det/bB.mp4   (style "none" = no music)
   window.ready() preloads + grades EVERY photo in PH_LIST before the first frame (throws if one is missing).

   FRAME / LOOK (automatic, in render()):
     21:9 letterbox on every shot: picture area PIC = {x:0, y:LB=127, w:1920, h:826}. Keep faces/text inside it.
     Post chain: camera (z/x/y/r/shake + gate weave) -> whip smear -> glitch -> transition FX (flash / leak) -> typewriter label
                 -> noir grade -> light flicker -> film grain -> vignette -> letterbox bars.
   SHOT OBJECT  SC.name = { draw(lt,d,t), cam(lt,d,t) -> {z,x,y,r,shake,glitch,vig,weave}, tin, label, noFlicker }
     tin   = transition INTO this shot: 'cut' | 'flash' (camera-flash "photo taken", white pop + bloom) | 'leak' (warm light leak)
             | 'whip' (horizontal smear out of previous + into this) | 'glitch' (RGB slice) | 'dip' (short dark dip).
     label = {txt, at, pos:'bl'|'br'|'tl'|'tr', size}  diegetic typewriter label (1-3 words), types at ~16 ch/s with cursor.
   PHOTOS (Soul Cinema stills, ../yt/img/NN_k.png, 2528x1088)
     PH_LIST = ['01_0', ...]  PH_GRADE['01_0'] = 'brightness(1.3) contrast(1.05)'  (CSS filter baked once at load).
     photoShot(id, lt, d, o) Ken Burns inside PIC (never shows edges, keeps aspect). o.z:[z0,z1] (def [1,1.08]),
        o.f:[[u0,v0],[u1,v1]] focal point in image 0..1 (start->end), o.ease (def linear), o.over(lt,k,s) overlays drawn in
        IMAGE PIXEL coords (LS set: line widths stay screen px). Returns {x,y,s}.
     Inside o.over: ledPatch(x,y,w,h,txt,o) covers garbled clock digits with a clean 7-segment readout (seg7(txt,x,y,h,col)).
        quadScreen(scrFn, sw, sh, [TL,TR,BR,BL], o) draws a phone/monitor screen (scrFn(sw,sh) centred coords) warped onto a
        quad in the photo with a bilinear triangle mesh (texTri) (o.glow col, o.glowR, o.tint multiply col, o.blur px, o.alpha)
        — use it to cover AI-garbled screens. Find the quad on a gridded crop of the full-res PNG (image pixel coords).
        frontMask(id, polys) re-draws the original photo inside polygons (fingers/thumbs in front of a replaced screen).
        marker(kind, pts, p, o) hand-drawn red marker: kind 'circle' pts=[cx,cy,rx,ry] | 'arrow' pts=[[x0,y0],[x1,y1]] |
        'under' pts=[[x0,y],[x1,y]]; p 0..1 draw-on progress (use at(lt,a,a+.45)).
     Screens: scrCallNoir(t, name) tall incoming-call screen; scrBankNoir(o) {bal, press, sent} bank transfer screen.
   EVIDENCE BOARD
     boardShot(lt, d, t, o): corkboard world 2600x1500 (cork texture, wood frame, desk-lamp pool). Camera glides
        o.cam:[[cx,cy,z],[cx,cy,z]] (world point at screen centre). o.items:[{id|draw, x,y,w,h,rot,at, crop:[u,v,zoom],
        kind:'polaroid'|'print'|'card', txt}] pinned (drop + pin-push at 'at'); o.strings:[[i,j,at,dur]] red string
        between item pins (twang wobble); o.stamps:[{txt,x,y,rot,at,size,col}] rubber stamps slam in; o.marks:[fn(lt)].
        Returns the board->screen transform; stampShake(lt, stamps) -> shake for cam().
     polaroid(src, x,y,w,h,rot,o{pin,crop,kind,txt,dim,noPin}) | redString(a,b,p,t,o) | pushPin(x,y,s,col) | indexCard(txt,x,y,rot,o)
     stamp(txt,x,y,size,rot,p,col) works anywhere (e.g. FALSO slammed over a photo, in layer coords). o.clutter:false hides the
     decorative notes on the board; o.seed changes their layout.
   NOIR OFFICE (detective set)
     noirOffice(t, o) o.part:'back'|'front' (draw back, then the character, then front). o.dx shifts the set,
        o.lamp 0..1 lamp intensity (flicker auto), o.desk (front desk y, def 800), o.rain (window rain) o.blinds (stripe alpha).
        Back: teal-brown wall, window with rain + city glow, venetian blinds, filing cabinet, wall map with pins.
        Front: wooden desk, green banker's lamp + amber pool, manila case folders, coffee cup + steam, rotary phone.
     blindStripes(a, o) amber venetian-blind light bands (draw after the character at low alpha so he's lit by them).
   DETECTIVE SCORPIO
     DET = RM.hero + tan trench coat (lapels, double-breasted, belt, popped collar, white shirt + dark-red tie) + fedora
        (hairStyle:'fedora' keeps side hair + grey streaks under the brim). person(x,yFeet,s,DET,e,t) as usual.
     Framing presets (inside the 21:9 picture): behind desk s≈.95 feet 1150 (desk hides legs) | chest-up s≈1.15 feet 1500 |
        close s≈1.4 feet 1700. Never show partial legs: either desk in front or waist below the bottom bar (y>953).
     Poses: arms: detPoint(up) right arm raised to point + prop: () => pointerFinger(400, -640 - up*120, ang) |
        arms: detShh(), prop: shhProp() finger on the lips (nose/eyes stay visible) |
        hold a photo: arms {l: [[-235,-440],[-262,-560]]}, propBehind: true, prop: () => polaroid(id, -360,-700, 270,200, -.07, {noPin:true}).
   TRANSITION FX (screen space, used by tin automatically; callable): flashFX(p), leakFX(p, seed), grainFX(n), weave(t).
   AUDIO: SFX are NOT auto-generated; list them in detB_mix.json. detmix.py ENFORCES the user's rules: >=1 s apart (drops extras),
     warns above 1 per 4 s, SFX peaks = voice peak -12 dB (gain_db only lowers), soft attacks, no whoosh on cuts (whoosh_at only),
     rain -35 dB, final -14 LUFS. USER DECISION: NO MUSIC -> spec "style": "none" (detmix default; music_db: null also disables).
     noir/noirwarm beds still exist (music calibrated to music_db under the voice) but are not to be used. B1: 5 SFX in 23 s.
   QA: render 2 fps contact sheets for the whole block + frames f-1,f,f+1,f+3 around every cut; check for black/white frames.
   QA (MANDATORY): verify the final audio has narration throughout (per-second RMS check), e.g.
     ffmpeg -i bB.mp4 -af "asetnsamples=48000,astats=metadata=1:reset=1,ametadata=print:key=lavfi.astats.Overall.RMS_level" -f null -
     and also check the input bB.wav per second BEFORE mkenv/render (a silent voice gives a dead lip-sync envelope).
   ===================================================================================== */
/* (original YT_BASE header — helpers still available)
 =====================================================================================
   YT_BASE — landscape 1920x1080 Scorpio cartoon engine (from r17, built by the B1 pilot)
   Copy to ytB.html, then replace ONLY the "SCENES" section at the bottom (SC.*, SCN, PORTAL_CUTS, DUR, FADE_IN, FADE_OUT).
   Render: cp r52_render.mjs-style yt1_render.mjs (viewport 1920x1080, env F0/F1, preview: node yt1_render.mjs prev/x 24 "t1,t2").
   Envelope: python3 ../batch/mkenv.py ../yt/vo/bB.wav ytB_tl.json   -> env(t) for lip-sync (talk: env(t)).
   Mix:  python3 ../yt/ytmix.py ytB_silent.mp4 ../yt/vo/bB.wav ../yt/bB_mix.json ../yt/out/bB.mp4  (see b1_mix.json for spec)

   COORDINATES: layer is 1920x1080, y down. person(x, yFeet, s, o, e, t): full adult ≈ 1100*s px tall (head centre at yFeet-810*s).
     Full body standing: s≈.75 feet ≈1030. Medium (waist up): s≈.95 feet ≈1150. Close-up: s≈1.45 feet≈1620.
   OUTLINES: LS/LSP stack keeps line widths constant at any scale. Use group(x,y,s,fn,rot) to draw a set/prop scaled;
     never set LS by hand. Close-ups: draw sets bigger with group() (keeps thin lines) rather than camera z>1.3.
   CAMERA: SC.x.cam(lt,d) -> {z, x, y, r, shake, soft, whip, glitch, noPunch, noFlash, vig}. Clamp prevents black edges.
     soft:1 = warm/slow (no punch, no flash, dark dip-in). glitch:0..1 = RGB slice post effect. whip:0..1 = smear (use for in-scene cuts).
   CHARACTERS
     RM.hero (=H0) Scorpio. head(o, hy, e, t) draws any head at hy (use in group for avatars).
     e = {mouth:'flat'|'smile'|'sad'|'laugh'|'gasp', talk:env(t), lid:0..1 (>=.97 = closed arcs), blink:blinkAt(t,o), brow, browUp, look:[x,y], lean, pose:'stand'|'walk'|'run'|'sit'|'none', ph, arms:{l:[elbow,hand], r:[...]}, prop:fn, propBehind, flip}
     MAMA / MAMA_NIGHT: warm Latina mom ~50, bun with grey streak, gold earrings + pendant, terracotta cardigan (long sleeves) over blouse.
     hooded(x, yDesk, s, e, t): the scammer — hood, shadow face, glowing green eyes. e={talk (glowing mouth lip-sync), grin, lid, shh, arms, eye, col, lean}
     Other people: Object.assign({}, MAMA or RM.hero, {skin, shirt, shirtD, pants, hairStyle:'mamaBun'|'none', female, lashes, noBags, longSleeve, cardigan, blouse}).
       RM kid (RM.kid), aliens RM.alienA/B/C, FA/FB (antennae).
   SETS (landscape): mamaRoom(t,o) wide bedroom (MR anchors: fy, nsX, nsTop, bx, bw) | mamaMed(t, cx, e, o) Mamá sitting up in bed
     (o.phone:'ear'|'hands', s, py, lampOn, glowPhone, noBlanket) | scamRoom(t, cx, e, o) lair (o.s, dy, holo, amp, mic, monitors, part:'bg')
     | interiorWall(col, floorCol, fy) | homeRoom(t, warm, night, win) | curtainWin(x,y,w,h,t) | nightSkyIn | skyNight/skyDay/skySunset
     | mamaAsleep(t,o) | scorpioRoom(t) Scorpio's night bedroom, him asleep (posters, bed MR layout) | bankClose(t, lt, scr, o) big phone in Mamá's hand (o.px,s,dy,tap,bgx)
     | sleeperHead(x,y,s,o,e,t,rot) head lying on a pillow | bedBlanket(bx,bw,mt,t,col,headX)
   PROPS: phoneDev(x,y,s,rot,scr,o) with screens scrIncoming(t,name) scrCall(t,name,secs) scrBank({bal,press,sent}) | phoneDown(x,y,s)
     avatar(x,y,r,t,e,o,bg) | photoFrame(x,y,s,t) | clockLED(x,y,s,txt,t) | nightstand | lampTable(x,top,on,s) | bill(x,y,rot,s,a)
     waveform(x,y,w,h,t,amp,col,n,seed) | holoG(x,y,w,h,t,draw,col) green/cyan hologram panel | holo() cyan (r17)
     holoize(fn,t,col) draw anything as hologram | dissolve(fn,bx,by,bw,bh,p,seed,cell) pixel-dissolve | portal(x,y,r,t,a)
     glow, tint(a,col), blurred(px,fn) depth of field, pulseRings, heartIcon, tear, sweat, zzz, vibLines, badge, burst, star,
     kaboom, angerMark, checkIcon, sparkle, confetti, rainIn, stars, sun, bird, planetFace, stormCloud, blobDog, saucerCar, quilt.
   TEXT: text(str,x,y,size,col,font,stroke,align) fonts AN (Anton), BG (Bangers), M9 (Montserrat 900); EF/MF/BF = + emoji.
   ===================================================================================== */
const W = 1920, H = 1080;
const out = document.getElementById('c'), octx = out.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
let ctx = layer.getContext('2d');
let ENV = [];
const OL = '#141014', LW = 6;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const backOut = t => { t = clamp(t); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const nz = (t, s = 0) => Math.sin(t * 1.13 + s) * .5 + Math.sin(t * 2.31 + s * 1.7) * .3 + Math.sin(t * 4.07 + s * 2.3) * .2;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let LS = 1; const LSP = []; // LS = current scale (outline widths stay constant); LSP = stack
function fo(fill, lw = LW) { if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (lw) { ctx.lineWidth = lw / LS; ctx.strokeStyle = OL; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); } }
function rect(x, y, w, h, fill, lw = LW) { ctx.beginPath(); ctx.rect(x, y, w, h); fo(fill, lw); }
function rrect(x, y, w, h, r, fill, lw = LW) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); fo(fill, lw); }
function ell(x, y, rx, ry, fill, lw = LW, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, Math.PI * 2); fo(fill, lw); }
function poly(pts, fill, lw = LW) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); fo(fill, lw); }
function line(pts, w = LW, col = OL) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.lineWidth = w / LS; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
function curve(a, c, b, w = LW, col = OL) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo(c[0], c[1], b[0], b[1]); ctx.lineWidth = w / LS; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.stroke(); }
function tube(pts, w, fill) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = w + 2 * LW / LS; ctx.strokeStyle = OL; ctx.stroke(); ctx.lineWidth = w; ctx.strokeStyle = fill; ctx.stroke(); }
function text(t, x, y, size, col, font = 'AN', stroke = 0, align = 'center') { ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; if (stroke) { ctx.lineWidth = stroke; ctx.strokeStyle = OL; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); } ctx.fillStyle = col; ctx.fillText(t, x, y); }
function vgrad(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }

// ---------------- PEOPLE (La Familia del Barrio-like construction) ----------------
const P = {
  hero: { skin: '#c4865c', skinD: '#a56c47', hair: 'pomp', shirt: '#8db4e2', shirtD: '#6c93c6', pants: '#f1eee6', shoe: '#5a3a28', collar: 1 },
  kid: { skin: '#c4865c', skinD: '#a56c47', hair: 'kid', shirt: '#e4a24a', shirtD: '#c78533', stripes: 1, pants: '#4b6aa8', shoe: '#d6453d', kid: 1 },
  carlos: { skin: '#b67a52', skinD: '#956040', hair: 'slick', mustache: 1, shirt: '#24222a', shirtD: '#18161c', tux: 1, pants: '#24222a', shoe: '#111' },
  novia: { skin: '#d9a07a', skinD: '#bb835f', hair: 'bun', dress: '#fbf7ee', veil: 1, female: 1, shoe: '#fbf7ee' },
  ana: { skin: '#e0ae88', skinD: '#c28f6a', hair: 'pony', shirt: '#e75a7c', shirtD: '#c4405f', pants: '#3d4a7a', shoe: '#fbf7ee', female: 1 },
  luis: { skin: '#a8704a', skinD: '#8a5a3a', hair: 'cap', mustache: 1, shirt: '#2bb3b1', shirtD: '#1f8f8d', pants: '#3d3a4a', shoe: '#2a2a2a', belly: 1 },
  mama: { skin: '#c4865c', skinD: '#a56c47', hair: 'curly', dress: '#d6453d', female: 1, shoe: '#5a3a28', apron: 1 },
};
function head(o, hy, e, t) {
  if (o.rm) return headRM(o, hy, e, t);
  const sk = o.skin, kid = o.kid;
  const rx = kid ? 98 : 102, ry = kid ? 104 : 118;
  // ears
  ell(-rx + 2, hy + 10, 22, 30, sk); ell(rx - 2, hy + 10, 22, 30, sk);
  // head + big chin (Family-Guy-like jaw)
  ctx.beginPath();
  ctx.moveTo(-rx, hy);
  ctx.bezierCurveTo(-rx, hy - ry * 1.25, rx, hy - ry * 1.25, rx, hy);
  if (kid) ctx.bezierCurveTo(rx, hy + ry * .95, -rx, hy + ry * .95, -rx, hy);
  else { ctx.bezierCurveTo(rx + 4, hy + 70, rx * .7, hy + ry + 40, 0, hy + ry + 46); ctx.bezierCurveTo(-rx * .7, hy + ry + 40, -rx - 4, hy + 70, -rx, hy); }
  ctx.closePath(); fo(sk);
  if (o.mustache || (!kid && !o.female)) { // stubble shade on jaw
    ctx.save(); ctx.clip(); ctx.fillStyle = o.mustache ? 'rgba(0,0,0,0)' : 'rgba(70,40,50,0.16)'; ctx.beginPath(); ctx.ellipse(0, hy + ry * .95, rx * .82, ry * .5, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  // eyes: two big touching white ovals
  const ey = hy - (kid ? 6 : 14), er = kid ? [36, 44] : [33, 41], ex = er[0] - 1;
  const lk = e.look || [0, 0], lid = clamp((e.lid ?? .35) + (e.blink || 0) * (1 - (e.lid ?? .35)));
  for (const s of [-1, 1]) {
    const cx = s * ex;
    ell(cx, ey, er[0], er[1], '#ffffff', 5);
    ell(cx + lk[0] * 12, ey + 4 + lk[1] * 12, 7.5, 9, OL, 0);
    if (lid > .02) {
      ctx.save(); ctx.beginPath(); ctx.ellipse(cx, ey, er[0], er[1], 0, 0, 7); ctx.clip();
      ctx.fillStyle = sk; ctx.fillRect(cx - 50, ey - er[1] - 2, 100, er[1] * 2 * lid + 2); ctx.restore();
      line([[cx - er[0] + 3, ey - er[1] + er[1] * 2 * lid], [cx + er[0] - 3, ey - er[1] + er[1] * 2 * lid]], 5);
      ell(cx, ey, er[0], er[1], null, 5);
    }
    // brows
    const b = e.brow ?? .3, by = ey - er[1] - 14 - (e.browUp || 0) * 14;
    line([[cx - s * 26, by - b * 10 * (s < 0 ? 1 : 1)], [cx + s * 22, by + b * 8]], 9, o.hair === 'curly' || o.female ? '#3a2228' : '#1c1620');
  }
  // nose (round, overlapping eyes)
  ell(4, hy + 30, kid ? 16 : 20, kid ? 16 : 22, o.skinD, 5);
  // mustache
  if (o.mustache) { ctx.beginPath(); ctx.moveTo(-50, hy + 66); ctx.quadraticCurveTo(0, hy + 40, 50, hy + 66); ctx.quadraticCurveTo(0, hy + 58, -50, hy + 66); fo('#1c1620', 4); }
  // mouth
  const my = hy + (kid ? 64 : 82), talk = e.talk || 0, ex2 = e.mouth || 'flat';
  if (ex2 === 'laugh' || talk > .08) {
    const h = ex2 === 'laugh' ? 40 + Math.abs(Math.sin(t * 24)) * 10 : 8 + talk * 34, w = ex2 === 'laugh' ? 50 : 30 + talk * 8;
    ctx.beginPath(); ctx.moveTo(-w, my - 4); ctx.quadraticCurveTo(0, my - 10 + (ex2 === 'smile' ? 6 : 0), w, my - 4); ctx.quadraticCurveTo(w * .8, my + h, 0, my + h); ctx.quadraticCurveTo(-w * .8, my + h, -w, my - 4); fo('#5a1e26', 5);
    if (h > 18) { ctx.save(); ctx.clip(); rect(-w, my - 12, w * 2, 12, '#fff', 0); ell(0, my + h, w * .55, h * .35, '#d9606e', 0); ctx.restore(); }
    if (ex2 === 'laugh') { ctx.beginPath(); ctx.moveTo(rx - 8, hy - 80); ctx.quadraticCurveTo(rx + 16, hy - 46, rx - 4, hy - 34); ctx.quadraticCurveTo(rx - 26, hy - 46, rx - 8, hy - 80); fo('#bfe6f5', 4); }
  } else if (ex2 === 'smile') curve([-42, my - 8], [0, my + 24], [42, my - 8], 6);
  else if (ex2 === 'sad') curve([-30, my + 8], [0, my - 10], [30, my + 8], 6);
  else line([[-30, my], [30, my + 2]], 6);
  hairDraw(o, hy, rx, ry, t);
}
function hairDraw(o, hy, rx, ry, t) {
  const HC = '#1c1620';
  if (o.hair === 'pomp') { // Scorpio swept quiff + grey streaks
    const sw = Math.sin(t * 1.3) * 2;
    ctx.beginPath(); ctx.moveTo(-rx - 2, hy - 10);
    ctx.bezierCurveTo(-rx - 18, hy - 90, -rx + 10, hy - ry - 50, -40, hy - ry - 70 + sw);
    ctx.bezierCurveTo(0, hy - ry - 105 + sw, 80, hy - ry - 108 + sw, 135, hy - ry - 62 + sw);
    ctx.bezierCurveTo(150, hy - ry - 30, 120, hy - ry + 20, rx + 4, hy - 50);
    ctx.lineTo(rx, hy - 10); ctx.quadraticCurveTo(rx - 14, hy - 60, rx - 34, hy - ry + 30);
    ctx.quadraticCurveTo(0, hy - ry + 16, -50, hy - ry + 40); ctx.quadraticCurveTo(-rx + 4, hy - ry + 70, -rx + 6, hy - 10); ctx.closePath(); fo(HC);
    curve([-60, hy - ry - 28], [10, hy - ry - 92], [110, hy - ry - 66], 11, '#9a96a2'); curve([-30, hy - ry + 4], [30, hy - ry - 46], [118, hy - ry - 40], 7, '#9a96a2');
  } else if (o.hair === 'kid') {
    ctx.beginPath(); ctx.moveTo(-rx - 4, hy - 4); const pts = [[-rx - 14, hy - 60], [-rx + 6, hy - ry - 20], [-40, hy - ry - 50], [-10, hy - ry - 18], [24, hy - ry - 54], [50, hy - ry - 12], [rx - 8, hy - ry - 34], [rx + 12, hy - 56], [rx + 4, hy - 4]];
